name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-assets:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make python3

      - name: Build compiler
        run: make clean && make

      - name: Run conformance tests
        run: make test

      - name: Package release archive
        run: |
          mkdir -p dist
          cp bin/oxide dist/
          cp README.md LICENSE dist/
          tar -czf "oxide-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C dist .

      - name: Upload asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxide-${{ matrix.target }}
          path: oxide-${{ github.ref_name }}-${{ matrix.target }}.tar.gz

  publish:
    name: Publish GitHub Release
    needs: build-assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.tar.gz
          generate_release_notes: true
